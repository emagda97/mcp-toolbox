steps:

  - id: "download-dependencies"
    name: "gcr.io/cloud-builders/gcloud:latest"
    waitFor: ['-']
    script: |
        #!/usr/bin/env bash
        set -e
        # Pre-download dependencies for test containers
        mkdir -p ./binaries
        gcloud storage cp gs://toolbox-build-assets/compile-dependencies/cloud-sql-proxy.linux.amd64 ./binaries/cloud-sql-proxy
        echo "1cb8f9087943b116f0be92a7291b2cd05d5fef515f8f1f0c045251bad464b022  ./binaries/cloud-sql-proxy" | sha256sum -c -
        chmod +x ./binaries/cloud-sql-proxy
        
        VERSION=$(cat ./cmd/version.txt)
        gcloud storage cp gs://mcp-toolbox-for-databases/v${VERSION}/linux/amd64/toolbox ./binaries/toolbox
        chmod +x ./binaries/toolbox

  - name: "${_IMAGE}"
    id: "go-pre-post-processing-test"
    waitFor: ["download-dependencies"]
    entrypoint: "bash"
    args:
      - -c
      - |
        set -ex
        chmod +x .ci/sample_tests/run_tests.sh
        .ci/sample_tests/run_tests.sh
    env:
      - "CLOUD_SQL_INSTANCE=${_CLOUD_SQL_INSTANCE}"
      - "GCP_PROJECT=${_GCP_PROJECT}"
      - "DATABASE_NAME=${_DATABASE_NAME}"
      - "DB_USER=${_DB_USER}"
      - "TARGET_ROOT=${_TARGET_ROOT}"
      - "TARGET_LANG=${_TARGET_LANG}"
      - "TABLE_NAME=${_TABLE_NAME}"
      - "SQL_FILE=${_SQL_FILE}"
      - "AGENT_FILE_PATTERN=${_AGENT_FILE_PATTERN}"
    secretEnv: ["TOOLS_YAML_CONTENT", "GOOGLE_API_KEY", "DB_PASSWORD"]

availableSecrets:
  secretManager:
    - versionName: projects/${_GCP_PROJECT}/secrets/${_TOOLS_YAML_SECRET}/versions/8
      env: "TOOLS_YAML_CONTENT"
    - versionName: projects/${_GCP_PROJECT_NUMBER}/secrets/${_API_KEY_SECRET}/versions/latest
      env: "GOOGLE_API_KEY"
    - versionName: projects/${_GCP_PROJECT}/secrets/${_DB_PASS_SECRET}/versions/latest
      env: "DB_PASSWORD"

timeout: 1200s

substitutions:
  _AR_REPO_NAME: toolbox
  _TARGET_LANG: "go"
  _IMAGE: "us-central1-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO_NAME}/golang:1@sha256:3680233e3204827fbdc66088528ae6d4b3d034f51d03a99d454f6de034888244"
  _TARGET_ROOT: "docs/en/documentation/configuration/pre-post-processing/go"
  _TABLE_NAME: "hotels_go_pre_post_processing"
  _SQL_FILE: ".ci/sample_tests/setup_hotels.sql"
  _AGENT_FILE_PATTERN: "agent.go"

options:
  logging: CLOUD_LOGGING_ONLY
